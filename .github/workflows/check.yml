name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up tools
        uses: jdx/mise-action@v5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check source
        run: bun run check
      - name: Check committed artifact
        run: bun run build:check
